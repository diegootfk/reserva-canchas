databaseChangeLog:
  - changeSet:
      id: 001-create-pagos
      author: reserva-canchas
      changes:
        - createTable:
            tableName: pagos
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: id_reserva
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: monto
                  type: DOUBLE
                  constraints:
                    nullable: false
              - column:
                  name: metodo_pago
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: estado_pago
                  type: VARCHAR(30)

  - changeSet:
      id: 002-insert-pagos
      author: reserva-canchas
      changes:
        - insert:
            tableName: pagos
            columns:
              - column: { name: id_reserva, valueNumeric: 1 }
              - column: { name: monto, valueNumeric: 25000 }
              - column: { name: metodo_pago, value: "DEBITO" }
              - column: { name: estado_pago, value: "PAGADO" }

        - insert:
            tableName: pagos
            columns:
              - column: { name: id_reserva, valueNumeric: 2 }
              - column: { name: monto, valueNumeric: 26000 }
              - column: { name: metodo_pago, value: "CREDITO" }
              - column: { name: estado_pago, value: "PAGADO" }

        - insert:
            tableName: pagos
            columns:
              - column: { name: id_reserva, valueNumeric: 3 }
              - column: { name: monto, valueNumeric: 18000 }
              - column: { name: metodo_pago, value: "EFECTIVO" }
              - column: { name: estado_pago, value: "PENDIENTE" }

        - insert:
            tableName: pagos
            columns:
              - column: { name: id_reserva, valueNumeric: 4 }
              - column: { name: monto, valueNumeric: 18000 }
              - column: { name: metodo_pago, value: "DEBITO" }
              - column: { name: estado_pago, value: "RECHAZADO" }

        - insert:
            tableName: pagos
