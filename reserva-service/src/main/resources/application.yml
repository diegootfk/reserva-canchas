server:
  port: 7093

spring:
  application:
    name: reserva-service

  datasource:
    url: jdbc:mysql://localhost:3306/db_reserva_service?createDatabaseIfNotExist=true
    username: root
    password:

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true