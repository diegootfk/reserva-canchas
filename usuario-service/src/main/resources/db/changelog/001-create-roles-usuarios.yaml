databaseChangeLog:
  - changeSet:
      id: 001-create-roles
      author: reserva-canchas
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nombre_rol
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: descripcion
                  type: VARCHAR(150)

  - changeSet:
      id: 002-create-usuarios
      author: reserva-canchas
      changes:
        - createTable:
            tableName: usuarios
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nombre
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: apellido
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: password
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: telefono
                  type: VARCHAR(20)
              - column:
                  name: estado
                  type: VARCHAR(20)
              - column:
                  name: id_rol
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: usuarios
            baseColumnNames: id_rol
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_usuarios_roles

  - changeSet:
      id: 003-insert-roles
      author: reserva-canchas
      changes:
        - insert:
            tableName: roles
            columns:
              - column:
                  name: nombre_rol
                  value: ADMIN
              - column:
                  name: descripcion
                  value: Administrador del sistema
        - insert:
            tableName: roles
            columns:
              - column:
                  name: nombre_rol
                  value: CLIENTE
              - column:
                  name: descripcion
                  value: Usuario cliente
        - insert:
            tableName: roles
            columns:
              - column:
                  name: nombre_rol
                  value: OPERADOR
              - column:
                  name: descripcion
                  value: Operador del complejo deportivo

