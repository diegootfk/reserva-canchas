databaseChangeLog:
  - changeSet:
      id: 001-create-reservas
      author: reserva-canchas
      changes:
        - createTable:
            tableName: reservas
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: id_usuario
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: id_cancha
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: total
                  type: DOUBLE
                  constraints:
                    nullable: false
              - column:
                  name: estado
                  type: VARCHAR(30)

  - changeSet:
      id: 002-insert-reservas
      author: reserva-canchas
      changes:
        - insert:
            tableName: reservas
            columns:
              - column: { name: id_usuario, valueNumeric: 1 }
              - column: { name: id_cancha, valueNumeric: 1 }
              - column: { name: total, valueNumeric: 25000 }
              - column: { name: estado, value: "CONFIRMADA" }

        - insert:
            tableName: reservas
            columns:
              - column: { name: id_usuario, valueNumeric: 2 }
              - column: { name: id_cancha, valueNumeric: 2 }
              - column: { name: total, valueNumeric: 26000 }
              - column: { name: estado, value: "CONFIRMADA" }

        - insert:
            tableName: reservas
            columns:
              - column: { name: id_usuario, valueNumeric: 3 }
              - column: { name: id_cancha, valueNumeric: 3 }
              - column: { name: total, valueNumeric: 18000 }
              - column: { name: estado, value: "PENDIENTE" }

        - insert:
            tableName: reservas
            columns:
              - column: { name: id_usuario, valueNumeric: 4 }
              - column: { name: id_cancha, valueNumeric: 4 }
              - column: { name: total, valueNumeric: 18000 }
              - column: { name: estado, value: "CANCELADA" }

        - insert:
            tableName: reservas
            columns:
              - column: { name: id_usuario, valueNumeric: 5 }
              - column: { name: id_cancha, valueNumeric: 5 }
              - column: { name: total, valueNumeric: 22000 }
              - column: { name: estado, value: "CONFIRMADA" }

        - insert:
            tableName: reservas
