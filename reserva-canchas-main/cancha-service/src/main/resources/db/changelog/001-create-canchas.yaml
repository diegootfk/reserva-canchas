databaseChangeLog:
  - changeSet:
      id: 001-create-canchas
      author: reserva-canchas
      changes:
        - createTable:
            tableName: canchas
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nombre
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: tipo_cancha
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: precio_hora
                  type: DOUBLE
                  constraints:
                    nullable: false
              - column:
                  name: capacidad
                  type: INT
              - column:
                  name: estado
                  type: VARCHAR(30)

  - changeSet:
      id: 002-insert-canchas
      author: reserva-canchas
      changes:
        - insert:
            tableName: canchas
            columns:
              - column: { name: nombre, value: "Cancha Futbolito 1" }
              - column: { name: tipo_cancha, value: "FUTBOLITO" }
              - column: { name: precio_hora, valueNumeric: 25000 }
              - column: { name: capacidad, valueNumeric: 10 }
              - column: { name: estado, value: "DISPONIBLE" }

        - insert:
            tableName: canchas
            columns:
              - column: { name: nombre, value: "Cancha Futbolito 2" }
