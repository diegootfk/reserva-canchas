databaseChangeLog:
  - changeSet:
      id: 001-create-notificaciones
      author: reserva-canchas
      changes:
        - createTable:
            tableName: notificaciones
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: id_usuario
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: id_reserva
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: mensaje
                  type: VARCHAR(255)
              - column:
                  name: tipo_notificacion
                  type: VARCHAR(50)
              - column:
                  name: fecha_envio
                  type: VARCHAR(30)
              - column:
                  name: estado
                  type: VARCHAR(30)

  - changeSet:
      id: 002-insert-notificacion
      author: reserva-canchas
      changes:
        - insert:
            tableName: notificaciones
            columns:
              - column: { name: id_usuario, valueNumeric: 1 }
              - column: { name: id_reserva, valueNumeric: 1 }
              - column: { name: mensaje, value: "Reserva confirmada correctamente" }
              - column: { name: tipo_notificacion, value: "CONFIRMACION" }
              - column: { name: fecha_envio, value: "2026-05-10" }
              - column: { name: estado, value: "ENVIADA" }