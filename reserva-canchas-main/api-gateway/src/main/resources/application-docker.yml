server:
  port: 7090

spring:
  main:
    web-application-type: reactive

  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: esta_es_nuestra_klae_secreta_123456789_viva_el_ping_pong

  cloud:
    gateway:
      routes:

        # ==========================
        # MICROSERVICIOS
        # ==========================

        - id: usuario-service
          uri: http://usuario-service:7091
          predicates:
            - Path=/usuarios/**

        - id: cancha-service
          uri: http://cancha-service:7092
          predicates:
            - Path=/canchas/**

        - id: reserva-service
          uri: http://reserva-service:7093
          predicates:
            - Path=/reservas/**

        - id: pago-service
          uri: http://pago-service:7094
          predicates:
            - Path=/pagos/**

        - id: sede-service
          uri: http://sede-service:7095
          predicates:
            - Path=/sedes/**

        - id: horario-service
          uri: http://horario-service:7096
          predicates:
            - Path=/horarios/**

        - id: disponibilidad-service
          uri: http://disponibilidad-service:7097
          predicates:
            - Path=/disponibilidades/**

        - id: notificacion-service
          uri: http://notificacion-service:7098
          predicates:
            - Path=/notificaciones/**

        - id: resena-service
          uri: http://resena-service:7099
          predicates:
            - Path=/resenas/**

        - id: mantenimiento-service
          uri: http://mantenimiento-service:7100
          predicates:
            - Path=/mantenimientos/**

        - id: auth-service
          uri: http://auth-service:7101
          predicates:
            - Path=/auth/**

        # ==========================
        # SWAGGER DOCS
        # ==========================

        - id: auth-docs
          uri: http://auth-service:7101
          predicates:
            - Path=/api-docs/auth
          filters:
            - SetPath=/v3/api-docs

        - id: usuario-docs
          uri: http://usuario-service:7091
          predicates:
            - Path=/api-docs/usuarios
          filters:
            - SetPath=/v3/api-docs

        - id: cancha-docs
          uri: http://cancha-service:7092
          predicates:
            - Path=/api-docs/canchas
          filters:
            - SetPath=/v3/api-docs

        - id: reserva-docs
          uri: http://reserva-service:7093
          predicates:
            - Path=/api-docs/reservas
          filters:
            - SetPath=/v3/api-docs

        - id: pago-docs
          uri: http://pago-service:7094
          predicates:
            - Path=/api-docs/pagos
          filters:
            - SetPath=/v3/api-docs

        - id: sede-docs
          uri: http://sede-service:7095
          predicates:
            - Path=/api-docs/sedes
          filters:
            - SetPath=/v3/api-docs

        - id: horario-docs
          uri: http://horario-service:7096
          predicates:
            - Path=/api-docs/horarios
          filters:
            - SetPath=/v3/api-docs

        - id: disponibilidad-docs
          uri: http://disponibilidad-service:7097
          predicates:
            - Path=/api-docs/disponibilidades
          filters:
            - SetPath=/v3/api-docs

        - id: notificacion-docs
          uri: http://notificacion-service:7098
          predicates:
            - Path=/api-docs/notificaciones
          filters:
            - SetPath=/v3/api-docs

        - id: resena-docs
          uri: http://resena-service:7099
          predicates:
            - Path=/api-docs/resenas
          filters:
            - SetPath=/v3/api-docs

        - id: mantenimiento-docs
          uri: http://mantenimiento-service:7100
          predicates:
            - Path=/api-docs/mantenimientos
          filters:
            - SetPath=/v3/api-docs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:

      - name: Auth Service
        url: /api-docs/auth

      - name: Usuario Service
        url: /api-docs/usuarios

      - name: Cancha Service
        url: /api-docs/canchas

      - name: Reserva Service
        url: /api-docs/reservas

      - name: Pago Service
        url: /api-docs/pagos

      - name: Sede Service
        url: /api-docs/sedes

      - name: Horario Service
        url: /api-docs/horarios

      - name: Disponibilidad Service
        url: /api-docs/disponibilidades

      - name: Notificacion Service
        url: /api-docs/notificaciones

      - name: Resena Service
        url: /api-docs/resenas

      - name: Mantenimiento Service
        url: /api-docs/mantenimientos