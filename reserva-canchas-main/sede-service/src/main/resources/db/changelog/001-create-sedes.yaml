databaseChangeLog:
  - changeSet:
      id: 001-create-sedes
      author: reserva-canchas
      changes:
        - createTable:
            tableName: sedes
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nombre
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: direccion
                  type: VARCHAR(150)
              - column:
                  name: comuna
                  type: VARCHAR(80)
              - column:
                  name: telefono
                  type: VARCHAR(20)
              - column:
                  name: estado
                  type: VARCHAR(30)

  - changeSet:
