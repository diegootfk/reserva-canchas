databaseChangeLog:
  - changeSet:
      id: 001-create-resenas
      author: reserva-canchas
      changes:
        - createTable:
            tableName: resenas
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: id_usuario
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: id_cancha
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: id_reserva
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: calificacion
                  type: INT
              - column:
                  name: comentario
                  type: VARCHAR(255)
              - column:
                  name: fecha_resena
                  type: VARCHAR(30)

  - changeSet:
      id: 002-insert-resena
      author: reserva-canchas
      changes:
        - insert:
            tableName: resenas
            columns:
              - column: { name: id_usuario, valueNumeric: 1 }
              - column: { name: id_cancha, valueNumeric: 1 }
              - column: { name: id_reserva, valueNumeric: 1 }
              - column: { name: calificacion, valueNumeric: 5 }
              - column: { name: comentario, value: "Excelente cancha y buena atención" }
              - column: { name: fecha_resena, value: "2026-05-10" }