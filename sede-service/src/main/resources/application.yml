server:
  port: 7095

spring:
  application:
    name: sede-service

  datasource:
    url: jdbc:mysql://localhost:3306/db_sede_service?createDatabaseIfNotExist=true
    username: root
    password:

  liquibase:
    enabled: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true