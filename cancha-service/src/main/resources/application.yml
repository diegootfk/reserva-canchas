server:
  port: 7092

spring:
  application:
    name: cancha-service

  datasource:
    url: jdbc:mysql://localhost:3306/db_cancha_service?createDatabaseIfNotExist=true
    username: root
    password:

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  springdoc:
    api-docs:
      enabled: true

    swagger-ui:
      enabled: true
      path: /doc/swagger-ui.html