server:
  port: 7100

spring:
  application:
    name: mantenimiento-service

  datasource:
    url: jdbc:mysql://localhost:3306/db_mantenimiento_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password:

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true