databaseChangeLog:
  - changeSet:
      id: 001-create-mantenimientos
      author: reserva-canchas
      changes:
        - createTable:
            tableName: mantenimientos
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: id_cancha
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: fecha_inicio
                  type: VARCHAR(30)
              - column:
                  name: fecha_fin
                  type: VARCHAR(30)
              - column:
                  name: descripcion
                  type: VARCHAR(255)
              - column:
                  name: estado
                  type: VARCHAR(30)

  - changeSet:
      id: 002-insert-mantenimiento
      author: reserva-canchas
      changes:
        - insert:
            tableName: mantenimientos
            columns:
              - column: { name: id_cancha, valueNumeric: 1 }
              - column: { name: fecha_inicio, value: "2026-05-15" }
              - column: { name: fecha_fin, value: "2026-05-16" }
              - column: { name: descripcion, value: "Mantención preventiva de cancha" }
              - column: { name: estado, value: "PROGRAMADO" }