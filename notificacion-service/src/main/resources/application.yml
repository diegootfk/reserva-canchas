server:
  port: 7098

spring:
  application:
    name: notificacion-service

  datasource:
    url: jdbc:mysql://localhost:3306/db_notificacion_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password:

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true